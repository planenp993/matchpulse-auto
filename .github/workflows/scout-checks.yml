name: Scout Preview Checks
on:
  push:
    branches: [matchpulse-scout-v1]
    paths:
      - 'docs/scout.html'
      - 'docs/scout.css'
      - 'docs/scout-core.js'
      - 'docs/scout.js'
      - 'tests/test_scout.cjs'
      - '.github/workflows/scout-checks.yml'
      - 'scripts/build_scout_preview.py'
      - 'scripts/smoke_scout.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test Scout data rules and UI JavaScript
        run: node --test tests/test_scout.cjs
      - name: Validate existing goal model
        run: node --test tests/test_model_core.cjs
      - name: Smoke check real fixtures and history
        run: node scripts/smoke_scout.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package offline Scout preview
        run: python scripts/build_scout_preview.py
      - name: Check preview file
        run: test -s scout-offline.html
      - uses: actions/upload-artifact@v4
        with:
          name: MATCHPULSE-SCOUT-PREVIEW
          path: scout-offline.html
          retention-days: 14
