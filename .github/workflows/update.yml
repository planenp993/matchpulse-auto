name: Matchpulse Auto Football-Data Sync

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/data/**'
  workflow_dispatch:
  schedule:
    - cron: '17 05 * * 2,5'       # Historical CSV: Tuesday and Friday only
    - cron: '17 05 * * 0,1,3,4,6' # Daily calendars on all other mornings
    - cron: '17 17 * * *'         # Every evening: calendars only
    - cron: '41 04 * * 6'         # Saturday: keyless CC0 matches in open-only leagues

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: matchpulse-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify all Scout model, Elo and trend JavaScript
        run: node --test tests/*.cjs
      - name: Verify CSV import
        run: python -m unittest discover -s tests -v
      - name: Refresh calendar daily, history only twice weekly
        env:
          RUN_EVENT: ${{ github.event_name }}
          RUN_CRON: ${{ github.event.schedule }}
        run: |
          if [ "$RUN_CRON" = "17 05 * * 2,5" ]; then
            echo "Permitted full historical refresh (Tuesday/Friday)"
            python scripts/update.py --online
          elif [ "$RUN_CRON" = "41 04 * * 6" ]; then
            echo "Weekly CC0-only Bundesliga and Serie A; no Football-Data"
            python scripts/refresh_openfootball.py
            python scripts/update_calendar.py
          elif [ "$RUN_EVENT" = "push" ]; then
            echo "Code-only deployment; do not request any provider data"
          else
            echo "Calendar-only: zero requests to football-data.co.uk"
            python scripts/update_calendar.py
          fi
      - name: Multi-market model audit with fixed historical periods
        run: python scripts/evaluate.py
      - name: Independent Scout data coverage and quality audit
        run: python scripts/audit_scout.py
      - name: Persist verified results
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/mp-refresh
          cp docs/data/history.json docs/data/fixtures.json docs/data/status.json docs/data/model_report.json docs/data/coverage_audit.json /tmp/mp-refresh/
          cp docs/model-quality.md /tmp/mp-refresh/
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/mp-refresh/history.json /tmp/mp-refresh/fixtures.json /tmp/mp-refresh/status.json /tmp/mp-refresh/model_report.json /tmp/mp-refresh/coverage_audit.json docs/data/
            cp /tmp/mp-refresh/model-quality.md docs/model-quality.md
            # Reuse the comparison only when the exact history, code and protocol
            # match. Run after reset so another writer's latest code is respected.
            node scripts/compare_goal_models.cjs --write --if-needed --progress
            node scripts/compare_goal_models.cjs --check
            # Read the latest committed ledger only after resetting to main.
            # Rejected pushes repeat capture/settlement from that latest ledger.
            node scripts/forecast_diary.cjs --check --base-ref origin/main
            node scripts/forecast_diary.cjs --write
            node scripts/forecast_diary.cjs --check
            git add docs/data/history.json docs/data/fixtures.json docs/data/status.json docs/data/model_report.json docs/data/coverage_audit.json docs/model-quality.md
            git add docs/data/diary docs/data/diary_report.json
            git add docs/data/model_comparison.json docs/model-comparison.md
            if git diff --staged --quiet; then
              echo "No data changes"
              break
            fi
            git commit -m 'Refresh football results and fixtures [skip ci]'
            if git push origin HEAD:main; then
              echo "Updated data successfully"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Failed to persist data after 3 retries"
              exit 1
            fi
            echo "Concurrent change detected; retrying on latest main"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy site
        uses: actions/deploy-pages@v4
        id: deploy
