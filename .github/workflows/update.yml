name: Matchpulse Auto Football-Data Sync

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/data/**'
  workflow_dispatch:
  schedule:
    - cron: '17 05,17 * * *'  # Twice daily UTC; GitHub scheduling may be delayed

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: matchpulse-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Match Lab model and JavaScript
        run: node --test tests/test_model_core.cjs
      - name: Verify CSV import
        run: python -m unittest discover -s tests -v
      - name: Refresh Football-Data data
        run: python scripts/update.py --online
      - name: Walk-forward model audit
        run: python scripts/evaluate.py
      - name: Persist verified results
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/mp-refresh
          cp docs/data/history.json docs/data/fixtures.json docs/data/status.json docs/data/model_report.json /tmp/mp-refresh/
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/mp-refresh/history.json /tmp/mp-refresh/fixtures.json /tmp/mp-refresh/status.json /tmp/mp-refresh/model_report.json docs/data/
            git add docs/data/history.json docs/data/fixtures.json docs/data/status.json docs/data/model_report.json
            if git diff --staged --quiet; then
              echo "No data changes"
              break
            fi
            git commit -m 'Refresh football results and fixtures [skip ci]'
            if git push origin HEAD:main; then
              echo "Updated data successfully"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Failed to persist data after 3 retries"
              exit 1
            fi
            echo "Concurrent change detected; retrying on latest main"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy site
        uses: actions/deploy-pages@v4
        id: deploy
