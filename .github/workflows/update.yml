name: Matchpulse Auto Football-Data Sync

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/data/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto catches missed work; full checks 42 historical sources'
        type: choice
        options: [auto, full, history, calendar, fixtures, results, europe, standings, publish]
        default: auto
  workflow_call:
    inputs:
      mode:
        description: 'Mode selected by the independently scheduled refresh clock'
        type: string
        required: false
        default: auto

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: matchpulse-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify all Scout model, Elo and trend JavaScript
        run: node --test tests/*.cjs
      - name: Verify CSV import
        run: python -m unittest discover -s tests -v
      - name: Collect only explicitly requested or overdue data
        env:
          RUN_EVENT: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.mode || 'auto' }}
        run: python scripts/data_sync.py collect --event "$RUN_EVENT" --mode "$REQUESTED_MODE" --commit "$GITHUB_SHA" --patch /tmp/mp-patch.json
      - name: Verify frozen registered studies without delaying live data
        run: python scripts/check_research.py
      - name: Apply, audit and persist on the latest main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            # Reapply observations to the newest files; never copy an old whole
            # history or calendar over another writer's newer publication.
            python scripts/data_sync.py apply --patch /tmp/mp-patch.json
            python scripts/statarea.py --check
            python scripts/forebet.py --check
            python scripts/audit_scout.py
            python scripts/europe_archive.py --check
            python scripts/standings.py --check
            python scripts/selection_quotes.py --check
            python scripts/check_research.py
            node scripts/forecast_diary.cjs --check --base-ref origin/main
            node scripts/paired_model_diary.cjs --check --base-ref origin/main
            node scripts/selection_diary.cjs --check --base-ref origin/main
            node scripts/match_plan_diary.cjs --check --base-ref origin/main
            node scripts/curated_diary.cjs --check --base-ref origin/main
            node scripts/forecast_diary.cjs --write
            node scripts/paired_model_diary.cjs --write --base-ref origin/main
            node scripts/selection_diary.cjs --write
            node scripts/match_plan_diary.cjs --write
            node scripts/curated_diary.cjs --write
            node scripts/forecast_diary.cjs --check
            node scripts/paired_model_diary.cjs --check
            node scripts/selection_diary.cjs --check
            node scripts/match_plan_diary.cjs --check
            node scripts/curated_diary.cjs --check
            node scripts/schedule_archive.cjs
            node scripts/schedule_archive.cjs --check
            node scripts/smoke_scout.cjs
            # Last writer: version the exact files that this artifact publishes.
            python scripts/client_manifest.py
            python scripts/client_manifest.py --check
            git add data/match_registry.json docs/data/history.json docs/data/fixtures.json docs/data/status.json docs/data/coverage_audit.json
            git add docs/data/match_links.json docs/data/data_health.json
            git add docs/data/europe_history.json docs/data/europe_coverage.json docs/data/europe_fixture_names.json
            if [ -d data/europe ]; then git add data/europe; fi
            if [ -d data/statarea ]; then git add data/statarea; fi
            if [ -d data/forebet ]; then git add data/forebet; fi
            for file in data/europe_clubs.json data/europe_schedule.json data/result_provenance.json; do
              if [ -f "$file" ]; then git add "$file"; fi
            done
            git add docs/data/standings.json
            git add docs/data/market_coverage.json
            git add docs/data/selection_quotes.json
            if [ -d data/markets ]; then git add data/markets; fi
            git add docs/data/diary docs/data/diary_report.json docs/data/paired_model_report.json
            git add docs/data/selection_diary_report.json
            git add docs/data/match_plan_diary_report.json docs/data/curated_diary_report.json
            git add docs/data/client_manifest.json docs/data/schedule_archive.json
            if git diff --staged --quiet; then
              echo "No data changes"
              break
            fi
            git commit -m 'Refresh football results and fixtures [skip ci]'
            if git push origin HEAD:main; then
              echo "Updated data successfully"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Failed to persist data after 3 retries"
              exit 1
            fi
            echo "Concurrent change detected; reapplying to latest main"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MATCHPULSE-DATA-HEALTH
          path: |
            docs/data/data_health.json
            docs/data/coverage_audit.json
            /tmp/mp-patch.json
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy site
        uses: actions/deploy-pages@v4
        id: deploy
      - name: Prune only the reviewed merged heads when their recovery map is introduced
        if: github.event_name == 'push'
        run: |
          if git diff --quiet "$GITHUB_SHA^" "$GITHUB_SHA" -- ops/merged-branch-recovery.json; then
            echo "No new reviewed branch cleanup request"
          else
            python scripts/prune_merged_branches.py --apply
          fi
