name: Matchpulse Auto Football-Data Sync

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/data/**'
  workflow_dispatch:
  schedule:
    - cron: '23 20 * * 3'
    - cron: '23 18 * * 5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: matchpulse-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify CSV import
        run: python -m unittest discover -s tests -v
      - name: Refresh Football-Data data
        run: python scripts/update.py --online
      - name: Persist verified results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/history.json docs/data/fixtures.json docs/data/status.json
          if ! git diff --staged --quiet; then
            git commit -m 'Refresh football results and fixtures [skip ci]'
            git pull --rebase
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy site
        uses: actions/deploy-pages@v4
        id: deploy
