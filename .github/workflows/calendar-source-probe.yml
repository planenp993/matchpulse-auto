name: Calendar Provider Research

on:
  push:
    branches: [research/calendar-sources-2026-10-29]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-calendar-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: One-off public calendar availability and coverage
        run: python scripts/calendar_source_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CALENDAR-PROVIDER-RESEARCH
          path: calendar-provider-probe.json
          retention-days: 7
          if-no-files-found: warn
