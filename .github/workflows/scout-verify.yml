name: Scout Verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scout-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify committed client data versions before audit timestamps change
        run: |
          if [ -f docs/data/client_manifest.json ]; then
            python scripts/client_manifest.py --check
          else
            python scripts/client_manifest.py
          fi
      - name: All import, calendar and integrity regression tests
        run: python -m unittest discover -s tests -v
      - name: All model, Elo and trend regression tests
        run: node --test tests/*.cjs
      - name: Verify prospective diary and published append-only records
        run: |
          git fetch --no-tags --depth=1 origin main
          node scripts/forecast_diary.cjs --check --base-ref origin/main
          node scripts/paired_model_diary.cjs --check --base-ref origin/main
          node scripts/selection_diary.cjs --check --base-ref origin/main
          node scripts/match_plan_diary.cjs --check --base-ref origin/main
          node scripts/curated_diary.cjs --check --base-ref origin/main
      - name: Verify historical calendar against sealed pre-match records
        run: node scripts/schedule_archive.cjs --check
      - name: Check registered research against its frozen inputs
        run: python scripts/check_research.py
      - name: Audit the checked-out snapshot without provider requests
        run: python scripts/audit_scout.py
      - name: Verify isolated UEFA regulation archive
        run: python scripts/europe_archive.py --check
      - name: Verify locally retained Statarea observations without downloads
        run: |
          python scripts/statarea.py --check
          python scripts/forebet.py --check
          python scripts/soccerway.py --check
      - name: Verify provider standings without downloads
        run: python scripts/standings.py --check
      - name: Smoke check real history and fixtures
        run: node scripts/smoke_scout.cjs
      - name: Verify upcoming prices against saved fixture CSV observations
        run: python scripts/selection_quotes.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SCOUT-VERIFY-AUDIT
          path: |
            docs/data/coverage_audit.json
            docs/data/model_report.json
            docs/data/model_comparison.json
            docs/data/shot_model_comparison.json
            docs/data/scanner_validation.json
            docs/data/diary_report.json
            docs/data/paired_model_report.json
            docs/data/selection_diary_report.json
            docs/data/match_plan_diary_report.json
            docs/data/curated_diary_report.json
            docs/model-quality.md
            docs/model-comparison.md
            docs/shot-model-comparison.md
            docs/scanner-validation.md
          retention-days: 7
          if-no-files-found: warn

  browser:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build the self-contained preview
        run: |
          python scripts/client_manifest.py
          python scripts/build_scout_preview.py
      - name: Install the pinned browser test dependency
        run: |
          npm install --no-save --fetch-retries=1 --fetch-timeout=60000 playwright@1.56.1
          browser_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$browser_path" ]; then
            echo "SCOUT_BROWSER_EXECUTABLE=$browser_path" >> "$GITHUB_ENV"
            "$browser_path" --version
          else
            timeout 180s npx playwright install --with-deps chromium
          fi
      - name: Verify real match data, markets and identities on desktop and mobile
        run: |
          python -m http.server 8765 --directory docs > /tmp/scout-http.log 2>&1 &
          python -c 'import time,urllib.request; exec("for attempt in range(50):\n try:\n  urllib.request.urlopen(\"http://127.0.0.1:8765/scout.html\",timeout=1); break\n except OSError: time.sleep(0.1)\nelse: raise RuntimeError(\"Preview server did not start\")")'
          node scripts/test_scout_browser.cjs
          node scripts/test_selections_browser.cjs
          node scripts/test_backup_browser.cjs
          node scripts/test_loading_browser.cjs
          node scripts/test_calendar_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SCOUT-VERIFIED-PREVIEW
          path: |
            scout-calendar*.png
            scout-offline.html
            scout-desktop.png
            scout-mobile.png
            scout-match.png
            scout-scanner.png
            scout-diary.png
            scout-standings.png
            scout-standings-mobile.png
            scout-form.png
            scout-form-mobile.png
            scout-tendencies.png
            scout-statistics.png
            scout-results.png
            scout-xg-mobile.png
            scout-result-mobile.png
            scout-reading.png
            scout-shots.png
            scout-corners-mobile.png
            scout-current-form.png
            scout-current-reading.png
            scout-current-tendencies.png
            scout-selections.png
            scout-selections-mobile.png
            scout-selection-card.png
            scout-selection-card-mobile.png
            scout-match-plan-320.png
            scout-builders.png
            scout-columns*.png
            scout-selections-browser.json
            scout-backup-mobile.png
            scout-loading-browser.json
          retention-days: 7
