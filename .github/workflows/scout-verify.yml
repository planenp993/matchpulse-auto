name: Scout Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: ['work/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scout-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: All import, calendar and integrity regression tests
        run: python -m unittest discover -s tests -v
      - name: All model, Elo and trend regression tests
        run: node --test tests/*.cjs
      - name: Audit the checked-out snapshot without provider requests
        run: python scripts/audit_scout.py
      - name: Smoke check real history and fixtures
        run: node scripts/smoke_scout.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SCOUT-VERIFY-AUDIT
          path: docs/data/coverage_audit.json
          retention-days: 7
          if-no-files-found: warn
