name: MATCH LAB X | Public website checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/match-lab-x/**'
      - 'scripts/test_match_lab_x_site.cjs'
      - 'scripts/build_match_lab_x_snapshot.cjs'
      - '.github/workflows/match-lab-x-web.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 'Test viewer, model and syntax'
        run: node scripts/test_match_lab_x_site.cjs
      - name: 'Check shared public snapshot locations'
        run: |
          test -s docs/data/fixtures.json
          test -s docs/data/history.json
          test -s docs/data/client_manifest.json
          test -s docs/data/coverage_audit.json
          test -s docs/data/status.json
      - name: 'Check public GitHub Pages URL without failing the build'
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          url="https://planenp993.github.io/matchpulse-auto/match-lab-x/"
          code=$(curl -L -sS -o /tmp/mlx_page.html -w '%{http_code}' --max-time 20 "$url" || true)
          echo "MATCH LAB X GitHub Pages URL: $url"
          echo "GitHub Pages HTTP status: $code"
          if [ "$code" = "200" ]; then
            if grep -q 'MATCH LAB X' /tmp/mlx_page.html; then
              echo "Website is reachable and has MATCH LAB X branding"
            else
              echo "Page is reachable but does not contain the expected site yet"
            fi
          else
            echo "Pages not yet reachable, check Settings > Pages > main /docs without changing any existing Prime Syndicate configuration"
          fi
          for probe in "https://planenp993.github.io/matchpulse-auto/scout.html" "https://pages.github.com/" "https://raw.githack.com/planenp993/matchpulse-auto/main/docs/match-lab-x/index.html"; do
            status=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 12 "$probe" || true)
            echo "Control probe: $status $probe"
          done
